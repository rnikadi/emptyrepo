services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: focus
      POSTGRES_PASSWORD: focus
      POSTGRES_DB: focus
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focus"]
      interval: 3s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: postgres://focus:focus@db:5432/focus
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  pgdata:
