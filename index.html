<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Focus Journal</title>
  <meta name="description" content="A calm, private daily focus journal: set an intention, run focus timers, log what you finished.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23e0663a' stroke-width='4'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23e0663a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div>
        <p class="eyebrow" id="today-label"></p>
        <h1>Focus Journal</h1>
      </div>
      <div class="streak" title="Consecutive days with focus time or a finished task">
        <span id="streak-count">0</span><small>day streak</small>
      </div>
    </header>

    <section class="card">
      <label for="intention" class="label">Today's intention</label>
      <input id="intention" type="text" maxlength="200" placeholder="What matters most today?" autocomplete="off">
    </section>

    <section class="card timer">
      <div class="dial" role="timer" aria-live="off">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <defs><linearGradient id="ringg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent2)"/></linearGradient></defs>
          <circle class="track" cx="60" cy="60" r="54"/>
          <circle class="bar" id="bar" cx="60" cy="60" r="54"/>
        </svg>
        <div class="time" id="time">25:00</div>
      </div>
      <div class="timer-side">
        <div class="presets" role="group" aria-label="Session length">
          <button class="chip" data-min="15">15</button>
          <button class="chip active" data-min="25">25</button>
          <button class="chip" data-min="50">50</button>
        </div>
        <div class="row">
          <button class="btn primary" id="start">Start focus</button>
          <button class="btn" id="reset">Reset</button>
        </div>
        <p class="hint" id="today-minutes">0 min focused today</p>
      </div>
    </section>

    <section class="card">
      <h2 class="label">Today's tasks</h2>
      <form id="task-form" class="row">
        <input id="task-input" type="text" maxlength="200" placeholder="Add a task and press Enter" autocomplete="off" aria-label="New task">
        <button class="btn" type="submit">Add</button>
      </form>
      <ul id="tasks" class="tasks"></ul>
      <p class="hint empty" id="tasks-empty">No tasks yet. Keep the list short.</p>
    </section>

    <section class="card">
      <h2 class="label">Last 7 days</h2>
      <div class="chart" id="week"></div>
      <p class="hint" id="week-summary"></p>
    </section>

    <section class="card">
      <h2 class="label">Last 12 weeks</h2>
      <div class="chart heat" id="heat"></div>
    </section>

    <footer class="foot">
      <p id="mode">Your data stays in this browser.</p>
      <div class="row">
        <button class="btn small" id="export">Export</button>
        <label class="btn small" for="import">Import</label>
        <input id="import" type="file" accept="application/json" hidden>
        <button class="btn small" id="theme" aria-label="Toggle theme">Theme</button>
      </div>
      <p class="hint" id="msg" role="status"></p>
    </footer>
  </main>
  <script src="vendor/d3.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
